name: modulate

# Host-folder variant. Run from this directory so ./data and ./postgres point
# to the intended host folders. Create them and set ownership first; see
# README.md ("Host folder storage").
services:
  app:
    image: ${MODULATE_IMAGE:-ghcr.io/shandorius/modulate:latest}
    container_name: modulate-app
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://modulate:${POSTGRES_PASSWORD}@db:5432/modulate
      DATA_DIR: /data
    volumes:
      - ./data:/data
      # Uncomment on SELinux hosts:
      # - ./data:/data:Z
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:17-alpine
    container_name: modulate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: modulate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: modulate
    volumes:
      - ./postgres:/var/lib/postgresql/data
      # Uncomment on SELinux hosts:
      # - ./postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulate -d modulate"]
      interval: 5s
      timeout: 5s
      retries: 12
